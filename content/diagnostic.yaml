    - "Usage"
    - "Version trouvée"
    - "Version requise"
    - "État"
    - "Que faire ?"
    - "Scénarios indisponibles"
  todo_summary: "Que faire ?"
  nothing_to_do: "—"
  not_found: "absent"
  proxy_title: "Proxy"
  proxy_subtitle: "Ce que le poste déclare, et ce qui manque pour atteindre l'application en local"
  proxy_columns:
    - "Réglage"
    - "Valeur détectée"
    - "État"
    - "Que faire ?"
  git_notice_title: "git est indispensable"
  continue: "Continuer vers le catalogue"
  continue_hint: "Un outil manquant ne bloque que les scénarios qui en ont besoin."
  console_title: "Diagnostic du poste :"
  console_absent: "absent"
  console_todo: "À faire :"
