  running: "En cours"
  failed: >-
    Le diagnostic n'a pas pu s'exécuter. Relancez-le ; si cela continue, consultez le
    journal de l'application.
  summary_prefix: "Recherche terminée : "
  summary_ok: "tous les {total} outils sont prêts, aucun réglage n'est nécessaire."
  summary_tools_one: "{count} outil sur {total} demande une action"
  summary_tools_many: "{count} outils sur {total} demandent une action"
  summary_tools_none: "aucun des {total} outils ne demande d'action"
  summary_proxy: ", et NO_PROXY demande un réglage"
  badge: "Diagnostic, {count} outils absents ou trop anciens"
  group_required: "Outils requis ({milestone})"
  group_chain: "Outils de la chaîne ({milestone})"
  tools_title: "Outils"
  tools_subtitle: "Version trouvée sur ce poste, version requise et marche à suivre"
