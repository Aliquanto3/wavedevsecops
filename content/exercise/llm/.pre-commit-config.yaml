# Hooks locaux et hors ligne : ils lancent les outils verrouillés dans uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --offline ruff check
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run --offline pytest -q --tb=short
        language: system
        pass_filenames: false
        types: [python]
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --no-banner
        language: system
        pass_filenames: false
