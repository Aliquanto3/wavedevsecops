# Configuration du modèle de langage.
# Par défaut : Ollama, sur votre poste. Rien ne sort de la machine.
base_url = "http://127.0.0.1:11434/v1"
model = "llama3.2"
timeout_seconds = 60

# Seuls ces endpoints peuvent être appelés (le code refuse tout autre `base_url`).
allowed_endpoints = ["http://127.0.0.1:11434/v1"]
