# Pipeline du projet en GitHub Actions. Le même pipeline s'écrit dans « Jenkinsfile » (Jenkins)
# et dans « .gitlab-ci.yml » (GitLab CI) : quatre tâches, l'une après l'autre.
# Les commentaires « wds:job » et « wds:end » encadrent chaque tâche : WaveDevSecOps s'en sert pour
# surligner ses lignes. Ce fichier se lit, il ne s'exécute pas dans WaveDevSecOps.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # wds:job ruff
  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
  # wds:end

  # wds:job pytest
  pytest:
    name: Tests (pytest)
    needs: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q --tb=short
  # wds:end

  # wds:job gitleaks
  gitleaks:
    name: Secrets (gitleaks)
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gitleaks doit être installé sur la machine qui exécute la tâche.
      - run: gitleaks dir --no-banner --redact --exit-code 3 .
  # wds:end

  # wds:job bandit
  bandit:
    name: Analyse de sécurité (bandit)
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # Le code de l'application (src/), sans les exemptions « # nosec ».
      - run: uv run bandit -r src -q --ignore-nosec
  # wds:end
