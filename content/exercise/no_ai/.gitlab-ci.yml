# Pipeline du projet en GitLab CI. Le même pipeline s'écrit dans « .github/workflows/ci.yml »
# (GitHub Actions) et dans « Jenkinsfile » (Jenkins) : sept tâches, l'une après l'autre
# (une étape par tâche, car les tâches d'une même étape tournent en parallèle).
# Les commentaires « wds:job » et « wds:end » encadrent chaque tâche : WaveDevSecOps s'en sert pour
# surligner ses lignes. Ce fichier se lit, il ne s'exécute pas dans WaveDevSecOps.
stages: [ruff, pytest, gitleaks, bandit, pip_audit, uv_lock, quality_gate]

default:
  image: python:3.14

# wds:job ruff
ruff:
  # Lint (ruff)
  stage: ruff
  before_script:
    - pip install uv
    - uv sync --frozen
  script:
    - uv run ruff check .
# wds:end

# wds:job pytest
pytest:
  # Tests (pytest)
  stage: pytest
  before_script:
    - pip install uv
    - uv sync --frozen
  script:
    - uv run pytest -q --tb=short
# wds:end

# wds:job gitleaks
gitleaks:
  # Secrets (gitleaks)
  stage: gitleaks
  script:
    # gitleaks doit être installé dans l'image qui exécute la tâche.
    - gitleaks dir --no-banner --redact --exit-code 3 .
# wds:end

# wds:job bandit
bandit:
  # Analyse de sécurité (bandit)
  stage: bandit
  before_script:
    - pip install uv
    - uv sync --frozen
  script:
    # Le code de l'application (src/), sans les exemptions « # nosec ».
    # `--ini` : réglages de bandit lus hors de votre dépôt ({config} : dossier de la plateforme), donc un fichier .bandit déposé dans src/ n'écarte aucun test.
    - uv run bandit -r src -q --ignore-nosec --ini '{config}/bandit.ini'
# wds:end

# wds:job pip_audit
pip_audit:
  # Dépendances (pip-audit)
  stage: pip_audit
  before_script:
    - pip install uv
    - uv sync --frozen
  script:
    # Dépendances épinglées de requirements.txt, sans résolution ; {osv_url} : adresse du point OSV (dans WaveDevSecOps : le point local, base figée).
    - uv run pip-audit --vulnerability-service osv --osv-url '{osv_url}' --no-deps --disable-pip --progress-spinner off -r requirements.txt
# wds:end

# wds:job uv_lock
uv_lock:
  # Verrou des dépendances (uv)
  stage: uv_lock
  before_script:
    - pip install uv
  script:
    # Échoue si uv.lock ne correspond plus à pyproject.toml : `uv sync --frozen` ne le voit pas.
    - uv lock --check
# wds:end

# wds:job quality_gate
quality_gate:
  # Couverture du nouveau code (quality gate)
  stage: quality_gate
  variables:
    # L'historique complet : diff-cover compare aux lignes modifiées depuis la base de la MR.
    GIT_DEPTH: "0"
  before_script:
    - pip install uv
    - uv sync --frozen
  script:
    # Mesure de la couverture ; {config} : réglages de coverage hors de votre dépôt, {reports} : dossier des rapports du pipeline.
    - uv run pytest -o addopts= --cov '--cov-config={config}/coverage.ini' '--cov-report=xml:{reports}/coverage.xml' -q --tb=short
    # Échoue sous 80 % de couverture des lignes modifiées ; {base_sha} : le commit de base de la MR.
    - uv run diff-cover '{reports}/coverage.xml' '--compare-branch={base_sha}' --fail-under=80
# wds:end
