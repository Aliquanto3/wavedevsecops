# Textes du bandeau et de la carte de la chaîne (Stories 9.1 et 9.2, AD-2).
# Le serveur les projette tels quels : le front n'invente aucun texte ni lien.
# Un outil absent du poste (sonde de `tools.toml`) s'affiche en tirets ;
# une station `delivered: false` porte « Bientôt ».
schema_version: 1

label: "Chaîne de livraison"
here_text: "Vous êtes ici"
boundary_text: "CI | CD"
boundary_after: 3

map:
  button_text: "Carte ▾"
  button_label: "Carte de la chaîne"
  title: "Carte de la chaîne"
  soon_text: "Bientôt"
  unavailable_text: "indisponible"
  tools_title: "Outils"
  barriers_title: "Barrières"
  links_title: "Liée à"
  none_selected: "Sélectionnez une barrière pour voir ses checks, ses hooks et ses termes."
  kinds:
    check: "Check"
    hook: "Hook"
    term: "Terme"

stations:
  - number: 1
    name: "Poste local"
    description: "Ce qui se joue sur votre poste, avant même de pousser."
    delivered: true
    tools:
      - {id: git, label: "git"}
      - {id: pre-commit, label: "pre-commit"}
      - {id: gitleaks, label: "gitleaks"}
      - {id: ruff, label: "ruff"}
    barriers:
      - id: secret-scan
        label: "Pas de secret dans le commit"
        links:
          - {kind: hook, label: "pre-commit : gitleaks"}
          - {kind: check, label: "Aucun secret dans l'index"}
          - {kind: term, label: "Secret"}
      - id: lint
        label: "Code propre avant commit"
        links:
          - {kind: hook, label: "pre-commit : ruff"}
          - {kind: term, label: "Lint"}
  - number: 2
    name: "PR et CI"
    description: "La pull request et les vérifications automatiques qui la suivent."
    delivered: true
    tools:
      - {id: pytest, label: "pytest"}
      - {id: coverage, label: "coverage"}
      - {id: diff-cover, label: "diff-cover"}
    barriers:
      - id: tests
        label: "Tests verts"
        links:
          - {kind: check, label: "Tests"}
          - {kind: term, label: "Intégration continue"}
      - id: coverage
        label: "Couverture du diff"
        links:
          - {kind: check, label: "Couverture du diff"}
          - {kind: term, label: "Couverture"}
  - number: 3
    name: "Sécurité et qualité"
    description: "L'analyse du code et des dépendances."
    delivered: true
    tools:
      - {id: bandit, label: "bandit"}
      - {id: pip-audit, label: "pip-audit"}
    barriers:
      - id: static-analysis
        label: "Analyse statique"
        links:
          - {kind: check, label: "Analyse de sécurité"}
          - {kind: term, label: "SAST"}
      - id: dependencies
        label: "Dépendances sans faille connue"
        links:
          - {kind: check, label: "Audit des dépendances"}
          - {kind: term, label: "CVE"}
  - number: 4
    name: "Livraison"
    description: "Le passage de la CI à la mise à disposition."
    delivered: false
    tools: []
    barriers: []
