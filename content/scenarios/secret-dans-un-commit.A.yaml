# Station 1 (Story 7.3) : un secret dans un commit, que le hook pre-commit refuse avant même
# que le commit existe. Le dépôt d'exercice est celui du parcours (sans IA ou LLM) ; le hook
# lance le vrai `pre-commit run`, donc gitleaks, sur les fichiers de l'index. La configuration
# du gabarit est réduite à gitleaks pour ce scénario : ruff et pytest ont leurs propres
# scénarios, et ne ralentissent pas ici chaque commit. La clé ci-dessous est fictive.
schema_version: 1
scenario_id: secret-dans-un-commit
mode: A
title_text: Voir un secret refusé avant le commit
section: stations
station: 1
tracks: [llm, no_ai]
tools: [git, gitleaks, pre-commit]
template: empty
setup:
  - op: exercise_stage
    stage: auto
  - op: write_file
    path: .pre-commit-config.yaml
    content: |
      # Hooks locaux et hors ligne : gitleaks lit les fichiers de l'index avant chaque commit.
      repos:
        - repo: local
          hooks:
            - id: gitleaks
              name: gitleaks
              entry: gitleaks git --pre-commit --staged --no-banner
              language: system
              pass_filenames: false
  - op: commit
    message: Ajoute le projet d'inventaire
  - op: push
    branch: main
    as: origin-main
  - op: install_hooks
    hooks: [pre-commit]
  - op: write_file
    path: src/inventory/reappro.py
    content: |
      """Accès au service de réapprovisionnement."""

      AWS_ACCESS_KEY_ID = "AKIAQ3XTR7WUDNB4HK6P"


      def endpoint() -> str:
          return "https://reappro.example.org/api"
steps:
  - step_id: committer_sans_le_secret
    type: repo_state
    title_text: Committer sans la clé
    instruction_text: >-
      Le fichier `src/inventory/reappro.py` contient une clé d'accès écrite en clair. Ajoutez-le
      à l'index, puis essayez de le committer : le hook pre-commit lance gitleaks, qui refuse le
      commit. Retirez la clé du fichier (lisez-la plutôt dans l'environnement), ajoutez le
      fichier de nouveau et committez.
    explanation_text: >-
      gitleaks cherche des secrets dans ce que vous allez committer. Le hook s'exécute avant que
      le commit existe : un commit refusé n'apparaît nulle part dans le graphe, et la clé ne
      part jamais vers GitHub. C'est la première barrière contre les fuites de secrets, sur
      votre poste.
    expect:
      tree:
        present: [src/inventory/reappro.py]
      commits:
        - ahead_of: origin/main
          min: 1
      index:
        clean: true
    foreseen:
      - when:
          index:
            staged: [src/inventory/reappro.py]
        reason_text: >-
          Le fichier est dans l'index, mais pas encore committé : si la clé y est toujours, le
          hook pre-commit refusera le commit.
