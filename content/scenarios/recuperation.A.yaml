# Scénario A « récupération » (Story 6.3) : perdre un commit par `reset --hard`, le retrouver
# dans le reflog et le restaurer. Le commit perdu reste affiché en tirets jusqu'à sa restauration.
# Même setup pour les deux parcours : ce scénario enseigne git, pas le code d'exercice.
schema_version: 1
scenario_id: recuperation
mode: A
title_text: Récupération
tracks: [llm, no_ai]
tools: [git]
setup:
  - op: write_file
    path: README.md
    content: |
      # Mon projet

      Un petit projet pour s'entraîner avec git.
  - op: commit
    message: Ajoute le README
  - op: write_file
    path: src/bonjour.py
    content: |
      def bonjour(nom: str) -> str:
          return f"Bonjour, {nom} !"
  - op: commit
    message: Ajoute la fonction bonjour
    as: depart
  # Un dernier commit, local seulement : aucune branche de l'origine ne le retient.
  - op: write_file
    path: idee.txt
    content: |
      Une idée d'amélioration à garder.
  - op: commit
    message: Note une idée d'amélioration
    as: idee
steps:
  - step_id: perdre_le_commit
    type: repo_state
    title_text: Annuler le dernier commit, fichiers compris
    instruction_text: >-
      Le dernier commit, « Note une idée d'amélioration », vous semble inutile. Revenez au
      commit précédent en effaçant aussi ses fichiers du dossier : `idee.txt` doit disparaître.
    explanation_text: >-
      `git reset --hard HEAD~1` fait reculer `main` d'un commit et remet le dossier dans cet
      état. Le commit n'est plus sur aucune branche : le graphe l'affiche en tirets, car seul
      le reflog sait encore où il est.
    explain_ref: graph.commit_lost
    expect:
      head:
        at: "@depart"
      tree:
        absent: [idee.txt]
    foreseen:
      - when:
          head:
            at: "@depart"
          tree:
            present: [idee.txt]
        reason_text: >-
          La branche a reculé, mais `idee.txt` est resté dans votre dossier : une autre option de
          `reset` décide aussi du sort des fichiers.
    hints:
      lead_text: >-
        Vous voulez que la branche recule d'un commit, et que votre dossier suive ce
        recul au lieu de garder le fichier.
      partial_text: git reset ___ HEAD~1
      solution_text: git reset --hard HEAD~1

  - step_id: retrouver
    type: quiz
    title_text: Retrouver où était le commit
    instruction_text: >-
      Finalement, cette idée était bonne. Le commit n'apparaît plus dans l'historique de `main`.
      Quelle commande liste les positions par lesquelles `HEAD` est passée, y compris avant le
      `reset` ?
    explanation_text: >-
      Le reflog est le journal local des déplacements de `HEAD` et des branches. Tant qu'il n'est
      pas purgé (plusieurs semaines par défaut), un commit « perdu » y reste, avec sa position
      et son identifiant : de quoi le désigner à git comme n'importe quel commit.
    explain_ref: graph.commit_lost
    choices:
      - choice_id: reflog
        command_text: git reflog
        correct: true
      - choice_id: log
        command_text: git log
        effect_text: >-
          `git log` ne remonte que les commits accessibles depuis la branche : le commit perdu
          n'y figure plus. C'est le reflog qui garde la trace des déplacements.
      - choice_id: stash_list
        command_text: git stash list
        effect_text: >-
          La liste est vide : un commit annulé par `reset` n'est pas dans le stash, qui ne range
          que des modifications non commitées.
    hints:
      lead_text: >-
        Il faut le journal des déplacements, pas l'historique des commits : une commande dont le
        nom parle d'un journal de références.
      partial_text: git ___
      solution_text: git reflog

  - step_id: restaurer
    type: repo_state
    title_text: Restaurer le commit perdu
    instruction_text: >-
      Ramenez `main` sur le commit « Note une idée d'amélioration » : `idee.txt` doit revenir
      dans le dossier. Le commit n'est alors plus en tirets dans le graphe.
    explanation_text: >-
      `git reset --hard` accepte n'importe quelle position du reflog : en y ramenant `main`,
      vous remettez le commit sur une branche et les fichiers dans le dossier. Son identifiant,
      lu dans le reflog, convient aussi : `git reset --hard <sha>`. C'est ce commit-là qui est
      restauré : un nouveau commit au même message ne le remplacerait pas.
    explain_ref: graph.commit_lost
    expect:
      head:
        branch: main
        contains: "@idee"
      tree:
        present: [idee.txt]
      index:
        clean: true
    foreseen:
      - when:
          head:
            at: "@depart"
          tree:
            absent: [idee.txt]
        reason_text: >-
          `main` est toujours sur le commit précédent. Repérez dans le reflog la position
          d'avant le `reset`, puis ramenez-y `main`.
      - when:
          head:
            branch: main
          tree:
            present: [idee.txt]
        reason_text: >-
          `idee.txt` est revenu, mais pas le commit perdu : il est toujours en tirets dans le
          graphe. Ramenez `main` sur ce commit-là, repéré dans le reflog, plutôt que d'en créer
          un nouveau.
    hints:
      lead_text: >-
        Le reflog vient de vous montrer où se trouvait `main` avant la perte : la commande
        qui l'a fait reculer sait aussi la ramener à une position donnée.
      partial_text: "git reset --hard HEAD@{___}"
      solution_text: "git reset --hard HEAD@{1}"
