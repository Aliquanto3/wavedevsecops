# Pipeline simulé (AD-10, story 7.4) : décrit une seule fois, lu par `ci` (`ci.load_pipeline`).
#
# Le pipeline tourne sur chaque PR ouverte d'un scénario qui le déclare (`pipeline: true`),
# à chaque nouveau couple (head_sha, base_sha) : clone `git clone --shared` de origin.git dans
# `ci/<pr>-<sha7>/`, environnement hors ligne (AD-12), puis les jobs en série, dans l'ordre de
# ce fichier. Chaque job donne un check du même `job_id` ; chaque changement d'état passe par
# la file de l'espace (opération portant l'epoch), qui seule écrit github.json.
#
# Contrat d'un job (les stories 8.1, 8.3, 8.4 et 8.6 ajoutent ou complètent des jobs ici) :
#
# Tout job ajouté ici s'écrit aussi, à la même place dans l'ordre, dans les 6 fichiers CI des
# gabarits (content/exercise/{no_ai,llm}/ : .github/workflows/ci.yml, Jenkinsfile,
# .gitlab-ci.yml), encadré par « wds:job <job_id> » et « wds:end » en commentaires seuls sur
# leur ligne, avec son label_text et la commande « tool + human » (story 7.6,
# tests/test_pipeline_files.py), puis `uv run python scripts/update_fingerprints.py`.
#
#   job_id      identifiant du check (snake_case, motif JOB_ID_PATTERN) ; unique.
#   label_text  libellé affiché du check.
#   tool        identifiant de l'outil dans tools.toml (AD-16) : résolu par le registre, jamais
#               par le PATH. Un outil de résolution `uv-lock` tourne dans l'environnement du run.
#   required    check obligatoire pour merger (en plus des `required_checks` de la protection).
#   barrier     barrière de content/chain.yaml que ce check prouve (preuve `evidence_seen`
#               soumise quand l'apprenant lit la sortie : vue Distant + PR).
#   before      commandes lancées avant la sortie humaine, chacune `{tool, argv}` : elles doivent
#               finir par le code 0, sinon le check est en échec (la quality gate mesure d'abord la
#               couverture avec pytest). Leur sortie précède celle de l'outil dans le check.
#   human       argv de la sortie humaine (après l'outil) : sortie affichée verbatim, stdout puis
#               stderr, jamais réécrite. Son code de sortie fixe l'état du check.
#   machine     exécutions machine du même outil sur le même arbre, d'où viennent les constats
#               (fichier, ligne, règle, dépendance, vulnérabilité, couverture et seuil), jamais
#               du texte humain. Chacune : `argv`, `parse` (lecteur des constats, voir plus bas),
#               `when` (`failure` : seulement si la sortie humaine a échoué, par défaut ;
#               `always` : à chaque run, par exemple la quality gate qui affiche sa valeur).
#               Un constat `unscanned_file` (fichier que l'outil a sauté) change un succès en
#               échec : un vert ne prouve rien sur un fichier non analysé.
#   exit_codes  sens des codes de sortie de la sortie humaine : `success` et `failure` (listes) ;
#               tout autre code, un dépassement de délai ou un outil introuvable donnent
#               `error` (« ⚠ Erreur de l'outil », la PR reste bloquée, « Relancer le check »).
#
# Jetons remplacés par `ci` dans les argv (tout autre `{…}` est refusé au chargement) :
#   {repo}      chemin de l'arbre testé (`ci/<pr>-<sha7>/`) ; c'est aussi le dossier courant.
#   {base_sha}  SHA de la base de la PR (diff-cover --compare-branch={base_sha}, story 8.4).
#   {osv_url}   point OSV local (Settings.osv_url, AD-11, story 8.3) ; vide : job en erreur.
#   {report}    fichier de rapport de cette exécution machine, hors de l'arbre (machine seule).
#   {reports}   dossier des rapports du run (`ci/<pr>-<sha7>.reports/`), hors de l'arbre : la
#               couverture y est écrite, un fichier `coverage.xml` du dépôt ne la remplace pas.
#   {config}    `content/ci/` : réglages d'outils hors de l'arbre de l'apprenant (bandit.ini,
#               coverage.ini) ; un `.bandit` ou un `[tool.coverage]` du dépôt n'y change rien.
#
# Lecteurs `parse` livrés : ruff_json (`ruff check --output-format json`), junit (rapport
# `--junitxml` de pytest : fichier du test en échec), gitleaks_json (`--report-format json`).
# 8.1 a livré bandit_json, 8.3 pip_audit_json et cyclonedx_json (le SBOM : des composants, pas des
# constats), 8.4 ajoute coverage_json et diff_cover_json : un lecteur par format, dans
# `ci/findings.py`, et sa valeur dans `ci.Parse`. Une exécution machine peut viser un autre outil
# que le job (`tool:`), comme `coverage json` dans la quality gate.
schema_version: 1
jobs:
  - job_id: ruff
    label_text: Lint (ruff)
    tool: ruff
    required: true
    barrier: lint
    human: [check, .]
    machine:
      - argv: [check, ., --output-format, json, --no-fix]
        parse: ruff_json
    exit_codes: {success: [0], failure: [1]}

  - job_id: pytest
    label_text: Tests (pytest)
    tool: pytest
    required: true
    barrier: tests
    human: [-q, --tb=short]
    machine:
      - argv: [-q, --tb=no, --junitxml, "{report}"]
        parse: junit
    # 5 : aucun test collecté, tenu pour un échec du code (les tests ont disparu).
    exit_codes: {success: [0], failure: [1, 5]}

  - job_id: gitleaks
    label_text: Secrets (gitleaks)
    tool: gitleaks
    required: true
    barrier: secret-scan
    # `dir` analyse l'arbre du SHA de tête sans git du PATH ; `--exit-code 3` sépare une fuite
    # trouvée (3) d'une erreur de l'outil (1). Story 8.6 : `--config {config}/gitleaks.toml`
    # (règles par défaut, fichier hors du dépôt : un `.gitleaks.toml` déposé n'écarte rien) et
    # `--ignore-gitleaks-allow` (un commentaire `gitleaks:allow` n'écarte rien non plus). Un
    # `.gitleaksignore` à la racine reste lu par gitleaks : les scénarios le refusent (étape).
    human: [dir, --no-banner, --redact, --exit-code, "3", --ignore-gitleaks-allow, --config, "{config}/gitleaks.toml", .]
    machine:
      - argv: [dir, --no-banner, --redact, --exit-code, "3", --ignore-gitleaks-allow, --config, "{config}/gitleaks.toml", --report-format, json, --report-path, "{report}", .]
        parse: gitleaks_json
    exit_codes: {success: [0], failure: [3]}

  - job_id: bandit
    label_text: Analyse de sécurité (bandit)
    tool: bandit
    required: true
    barrier: static-analysis
    # `-r src` analyse le code de l'application (dossier src/), pas les tests (leurs `assert`
    # sont attendus) ; `-q` retire les lignes d'information de bandit ; `--ignore-nosec` refuse
    # les exemptions `# nosec` écrites dans le code. Il sort 1 quand il trouve un défaut.
    # L'exécution machine tourne aussi sur un succès : un fichier que bandit n'a pas pu lire
    # (syntaxe) est sauté avec le code 0, et `ci` en fait un échec (`unscanned_file`).
    # `--ini {config}/bandit.ini` (story 8.4) : bandit lit ses réglages dans un fichier hors du
    # dépôt, donc un `src/.bandit` déposé par l'apprenant (`skips = B307`) ne désactive rien.
    human: [-r, src, -q, --ignore-nosec, --ini, "{config}/bandit.ini"]
    machine:
      - argv: [-r, src, -q, --ignore-nosec, --ini, "{config}/bandit.ini", -f, json]
        parse: bandit_json
        when: always
    exit_codes: {success: [0], failure: [1]}

  - job_id: pip_audit
    label_text: Dépendances (pip-audit)
    tool: pip-audit
    required: true
    barrier: dependencies
    # Options exactes (AD-11, AR-23) : le vrai pip-audit lit le fichier d'exigences épinglées
    # `requirements.txt` (`-r`), sans résolution (`--no-deps`, `--disable-pip` : tout est épinglé
    # exactement), contre le point OSV local (`--vulnerability-service osv --osv-url`), jamais
    # contre PyPI. Trois exécutions sur le même arbre : sortie humaine affichée, `-f json` pour
    # les constats (dépendance, vulnérabilité, ligne du fichier), `-f cyclonedx-json` pour le
    # SBOM lu par `sbom-view`. Il sort 1 quand il trouve une vulnérabilité, ou si le fichier
    # d'exigences est absent ou invalide : la PR reste bloquée. La base est citée dans le constat
    # (« base embarquée, figée au <date> »). L'exécution du SBOM tourne aussi sur un succès ; un
    # fichier vidé de ses dépendances est refusé par l'étape du scénario (`sbom_has`).
    human: [--vulnerability-service, osv, --osv-url, "{osv_url}", --no-deps, --disable-pip, --progress-spinner, "off", -r, requirements.txt]
    machine:
      - argv: [--vulnerability-service, osv, --osv-url, "{osv_url}", --no-deps, --disable-pip, --progress-spinner, "off", -r, requirements.txt, -f, json]
        parse: pip_audit_json
      - argv: [--vulnerability-service, osv, --osv-url, "{osv_url}", --no-deps, --disable-pip, --progress-spinner, "off", -r, requirements.txt, -f, cyclonedx-json]
        parse: cyclonedx_json
        when: always
    exit_codes: {success: [0], failure: [1]}

  - job_id: uv_lock
    label_text: Verrou des dépendances (uv)
    tool: uv
    required: true
    barrier: dependencies
    # `uv lock --check` (story 8.4) : sort 1 si `uv.lock` ne correspond plus à `pyproject.toml`
    # (dépendance ajoutée ou changée sans verrou à jour). Sans lui, `uv sync --frozen` installe le
    # verrou tel quel et ne voit pas qu'un `pyproject.toml` modifié l'a dépassé. Aucune installation
    # ni écriture : il compare seulement ; hors ligne (UV_OFFLINE) depuis le cache préchargé.
    # uv n'a pas de sortie machine : sur un échec, l'exécution machine ne sert qu'à poser le
    # constat en français (« Le verrou uv.lock ne correspond plus à pyproject.toml… »), au-dessus
    # de la sortie brute de uv.
    human: [lock, --check]
    machine:
      - argv: [lock, --check]
        parse: uv_lock_check
    exit_codes: {success: [0], failure: [1]}

  - job_id: quality_gate
    label_text: Couverture du nouveau code (quality gate)
    tool: diff-cover
    required: true
    barrier: coverage
    # Mesure puis jauge (AD-10, story 8.4) : pytest mesure la couverture avec les réglages de
    # `{config}/coverage.ini` (hors du dépôt : ni `omit`, ni `# pragma: no cover`, ni `addopts`
    # du dépôt, remis à vide par `-o addopts=`, ne la réduisent) et écrit `coverage.xml` hors de
    # l'arbre ; diff-cover compare ce rapport aux lignes modifiées depuis `{base_sha}` et échoue
    # sous 80 % (`--fail-under=80`, le même chiffre que ci.findings.QUALITY_GATE_THRESHOLD).
    # Les options de pytest s'écrivent `--option=valeur` : pytest prend une valeur détachée pour un
    # chemin à collecter et en déduit sa racine (le dépôt de la plateforme au lieu de l'arbre).
    # Les constats viennent de `coverage json` et de `diff-cover --format json:` : toujours lus,
    # pour que le check affiche « Couverture du nouveau code n % · seuil 80 % · ✓ » même vert.
    before:
      - tool: pytest
        argv: [-o, addopts=, --cov, "--cov-config={config}/coverage.ini", "--cov-report=term-missing:skip-covered", "--cov-report=xml:{reports}/coverage.xml", -q, --tb=short]
    human: ["{reports}/coverage.xml", "--compare-branch={base_sha}", --fail-under=80]
    machine:
      - argv: ["{reports}/coverage.xml", "--compare-branch={base_sha}", --fail-under=80, --format, "json:{report}"]
        parse: diff_cover_json
        when: always
      - tool: coverage
        argv: [json, "--rcfile={config}/coverage.ini", -o, "{report}"]
        parse: coverage_json
        when: always
    exit_codes: {success: [0], failure: [1]}
