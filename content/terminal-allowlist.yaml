# Liste blanche du terminal (AD-4) : le seul fichier lu par la garde ET par le texte du refus.
# Une sous-commande ou une option absente d'ici est refusée ; la liste citée à l'apprenant
# est tirée de ce fichier. Les commandes de fichiers (ls, cat, echo…) sont sous `files`.
schema_version: 1

messages:
  metachar: >-
    Le terminal n'est pas un shell : « {found} » n'y a aucun effet. Tapez une seule commande
    par ligne, sans enchaînement, redirection ni substitution.
  unterminated: "Il manque la fin d'un guillemet ou d'un antislash dans cette ligne."
  unknown_command: "« {command} » n'est pas une commande de ce terminal."
  cd: >-
    « cd » n'existe pas ici : le terminal reste toujours à la racine du dépôt du bac à sable,
    et les chemins s'écrivent depuis cette racine (par exemple « git add src/app.py »).
  unknown_subcommand: "« git {sub} » n'est pas dans la liste de ce terminal."
  global_option: >-
    Les options placées avant la sous-commande (« {option} ») ne sont pas acceptées : écrivez
    « git » puis la sous-commande.
  forbidden_option: "L'option « {option} » est interdite dans ce terminal."
  unknown_option: "L'option « {option} » n'est pas acceptée pour « git {sub} »."
  bad_positional: "« git {sub} {value} » n'est pas accepté ; arguments possibles : {choices}."
  config_write: >-
    « git config » ne modifie ici que « user.name » et « user.email » ; les autres clés se
    lisent seulement.
  remote_target: >-
    « {value} » n'est pas un remote du dépôt. « git {sub} » vise un remote existant
    ({remotes}), jamais un chemin ni une adresse.
  accepted: "Commandes git acceptées : {subcommands}."
  accepted_options: "Options acceptées pour « git {sub} » : {options}."
  refused_argument: "« git {sub} {value} » n'est pas accepté dans ce terminal."
  too_many: "« git {sub} » reçoit trop d'arguments pour ce terminal."
  accepted_files: "Commandes de fichiers acceptées : {commands}."
  accepted_tools: "Outils acceptés quand l'étape les déclare : {tools}."
  tool_not_declared: >-
    « {tool} » n'est pas disponible dans ce scénario : ses étapes ne déclarent pas cet outil.
  tool_subcommand: "« {tool} » attend une sous-commande parmi : {subcommands}."
  tool_unknown_option: "L'option « {option} » n'est pas acceptée pour « {tool} »{accepted}."
  tool_options: " ; options acceptées : {options}"
  tool_path: >-
    « {value} » n'est pas un chemin du dépôt : écrivez-le depuis la racine du dépôt, sans « .. »
    ni chemin absolu.
  tool_missing_value: "L'option « {option} » de « {tool} » attend une valeur."
  tool_unavailable: >-
    « {tool} » ne peut pas tourner : {reason}. Ouvrez le diagnostic pour voir l'état des outils.
  tool_env_failed: >-
    L'environnement de l'exercice n'a pas pu être préparé : {reason}. Ouvrez le diagnostic, puis
    relancez la commande.
  tool_machine_failed: >-
    Les liens vers le code ne sont pas disponibles pour cette sortie ({reason}) ; la sortie
    ci-dessus est celle de l'outil, sans modification.
  file_unknown_option: "L'option « {option} » n'est pas acceptée pour « {command} »{accepted}."
  file_options_none: " (cette commande n'a pas d'option dans ce terminal)"
  file_options_some: " ; options acceptées : {options}"
  file_too_few: "« {command} » attend au moins {count} argument(s)."
  file_too_many: "« {command} » reçoit trop d'arguments pour ce terminal."
  redirect_misplaced: >-
    Une redirection ne s'écrit qu'avec « echo », une seule fois et en fin de ligne :
    « echo texte > fichier » ou « echo texte >> fichier ».
  redirect_target: "Il manque le nom du fichier après « {operator} »."
  file_error: "{command} : {cause}"
  file_no_match: "{command} : aucun fichier ne correspond à « {pattern} »."
  file_truncated: "cat : « {path} » dépasse {kib} Kio, la suite n'est pas affichée."
  file_multi_dest: "{command} : avec plusieurs sources, la destination doit être un dossier existant."
  pwd_output: "/repo"
  hint: "Tapez une commande git, par exemple « git status »."
  exit_code: "Code de sortie : {code}"
  missing_message: "git attend un message de commit. Ajoutez `-m \"…\"`."
  timeout: "La commande a dépassé {seconds} s : elle a été arrêtée."
  interrupted: "Commande interrompue."
  protected_branch: "Refusé par la protection de `{branch}` : tout passe par une PR."
  hook_refused_secret: >-
    Refusé par le hook pre-commit : gitleaks a trouvé un secret. Le commit n'a pas été créé.
  hook_refused: "Refusé par le hook pre-commit. Le commit n'a pas été créé."
  pre_commit_install: >-
    « pre-commit {sub} » est refusé : les hooks sont posés par le scénario, pas par vous. Le
    hook pre-commit se lance tout seul à chaque « git commit ».

# Options qu'aucune ligne n'obtient en dehors de la liste d'une sous-commande
# (le refus les nomme « interdites » plutôt qu'« absentes de la liste »).
forbidden_options:
  - "-c"
  - "-C"
  - "--git-dir"
  - "--work-tree"
  - "--exec-path"
  - "--config-env"
  - "--exec"
  - "-x"
  - "-i"
  - "-p"
  - "--interactive"
  - "--patch"
  - "--output"
  - "--no-index"
  - "--upload-pack"
  - "--receive-pack"
  - "--ext-diff"
  - "-F"
  - "--file"

# Commandes de fichiers, écrites en Python sur wsfs (story 2.5) : options, nombre d'arguments,
# `globs` (rm, mv, cp : `*` et `?` résolus dans le bac à sable), `redirect` (echo : `>` et `>>`).
files:
  ls: {read: true, options: ["-a"], max_args: 1}
  cat: {read: true, min_args: 1}
  echo: {redirect: true, text: true}
  touch: {min_args: 1}
  mkdir: {options: ["-p"], min_args: 1}
  rm: {options: ["-r", "-R", "-f"], min_args: 1, globs: true}
  mv: {min_args: 2, globs: true}
  cp: {options: ["-r", "-R"], min_args: 2, globs: true}
  pwd: {read: true, max_args: 0}
  clear: {read: true, max_args: 0}

# Outils de la chaîne (story 7.2, AD-4, AD-10) : acceptés seulement si le scénario les déclare
# dans `tools`, lancés par `toolrun` dans l'environnement d'exercice, hors ligne. `barrier_id` :
# la barrière de `chain.yaml` dont leur sortie est la preuve. Ni `-p`, ni `-c`, ni `--rootdir`,
# ni le séparateur `--`, ni une valeur séparée qui commence par `-` (pytest cherche `-p` partout) :
# aucune option ne charge un greffon ni ne change la racine ; `--fix` est la seule écriture.
tools:
  ruff:
    barrier_id: lint
    subcommands: ["check"]
    options: ["--fix", "--statistics", "--show-fixes", "--diff", "--select", "--ignore", "--no-cache"]
    value_options: ["--select", "--ignore"]
    write_options: ["--fix"]
  pytest:
    barrier_id: tests
    options: ["-q", "--quiet", "-v", "--verbose", "-vv", "-x", "--exitfirst", "-k", "-m", "--tb", "--maxfail", "-r", "--no-header", "--disable-warnings", "-l", "--showlocals", "--collect-only", "--co"]
    value_options: ["-k", "-m", "--tb", "--maxfail", "-r"]

# Hook pre-commit de l'application (story 7.3, AD-9, AD-14) : quand il refuse un commit, la
# sortie de l'outil en cause est la preuve de cette barrière de `chain.yaml`.
hook_barriers:
  gitleaks: secret-scan

# Chaque sous-commande git : `read` (vrai : lecture, admise pendant un quiz ; un objet : lecture
# seulement si toutes ses conditions tiennent), `options`, `value_options` (options qui prennent
# une valeur, collée ou dans l'argument suivant), `choices` (valeurs admises du premier argument).
git:
  add:
    read: false
    options: ["-A", "--all", "-u", "--update", "-n", "--dry-run", "-v", "--verbose", "-f", "--force", "-N", "--intent-to-add", "--"]
  commit:
    read: false
    options: ["-m", "--message", "-a", "--all", "--amend", "--no-edit", "--allow-empty", "--allow-empty-message", "--no-verify", "-s", "--signoff", "-q", "--quiet", "--dry-run", "--"]
    value_options: ["-m", "--message"]
    needs_message: true
  status:
    read: true
    options: ["-s", "--short", "-b", "--branch", "--porcelain", "--long", "-uno", "-unormal", "-uall", "--untracked-files", "-v", "--verbose", "--ignored", "--"]
  log:
    read: true
    options: ["-p", "--oneline", "--graph", "--all", "--decorate", "--no-decorate", "--stat", "--patch", "--no-patch", "-n", "--max-count", "--skip", "--pretty", "--format", "--abbrev-commit", "--author", "--since", "--until", "--grep", "--reverse", "--first-parent", "--merges", "--no-merges", "--name-only", "--name-status", "--follow", "--date", "--branches", "--tags", "--remotes", "--reflog", "-S", "-G", "--shortstat", "--numstat", "--"]
    value_options: ["-n", "--max-count", "--skip", "--author", "--since", "--until", "--grep", "-S", "-G"]
    number_option: true
  diff:
    read: true
    options: ["-p", "--patch", "--staged", "--cached", "--stat", "--name-only", "--name-status", "--shortstat", "--numstat", "-w", "--ignore-all-space", "-U", "--unified", "--no-patch", "--word-diff", "--check", "--summary", "--quiet", "--exit-code", "--color", "--no-color", "--"]
    value_options: ["-U", "--unified"]
  show:
    read: true
    options: ["-p", "--patch", "--stat", "--name-only", "--name-status", "--oneline", "--pretty", "--format", "--no-patch", "-s", "--abbrev-commit", "--shortstat", "--numstat", "--"]
  branch:
    read:
      options_within: ["-a", "--all", "-r", "--remotes", "-v", "-vv", "--verbose", "--list", "-l", "--show-current", "--merged", "--no-merged", "--contains"]
      positionals_max: 0
    options: ["-a", "--all", "-r", "--remotes", "-v", "-vv", "--verbose", "--list", "-l", "--show-current", "--merged", "--no-merged", "--contains", "-d", "--delete", "-D", "-m", "--move", "-M", "-f", "--force", "-u", "--set-upstream-to", "--unset-upstream", "--"]
    value_options: ["--set-upstream-to", "-u"]
  switch:
    read: false
    options: ["-c", "--create", "-d", "--detach", "-f", "--force", "--discard-changes", "--guess", "--no-guess", "-t", "--track", "--"]
  checkout:
    read: false
    options: ["-b", "-B", "--detach", "-f", "--force", "-t", "--track", "--ours", "--theirs", "--"]
  restore:
    read: false
    options: ["--staged", "-S", "--worktree", "-W", "--source", "-s", "--ours", "--theirs", "--"]
    value_options: ["--source", "-s"]
  reset:
    read: false
    options: ["--soft", "--mixed", "--hard", "--keep", "--merge", "-q", "--quiet", "--"]
  revert:
    read: false
    options: ["--no-edit", "-n", "--no-commit", "--continue", "--abort", "--skip", "-m", "--mainline", "--"]
    value_options: ["-m", "--mainline"]
  merge:
    read: false
    options: ["--no-ff", "--ff", "--ff-only", "--squash", "--no-commit", "--continue", "--abort", "--no-edit", "-m", "--message", "-q", "--quiet", "--no-verify", "--"]
    value_options: ["-m", "--message"]
  rebase:
    read: false
    options: ["--continue", "--abort", "--skip", "--onto", "--autostash", "--no-autostash", "-q", "--quiet", "--"]
    value_options: ["--onto"]
  stash:
    read:
      first_positional_in: ["list", "show"]
    choices: ["push", "pop", "apply", "list", "show", "drop", "clear", "branch"]
    options: ["-u", "--include-untracked", "-m", "--message", "-k", "--keep-index", "--index", "-q", "--quiet", "--"]
    value_options: ["-m", "--message"]
  tag:
    read:
      options_within: ["-l", "--list"]
      positionals_max: 0
    options: ["-a", "--annotate", "-m", "--message", "-d", "--delete", "-l", "--list", "-f", "--force", "--"]
    value_options: ["-m", "--message"]
    needs_message_with: ["-a", "--annotate"]
  push:
    read: false
    touches_origin: true
    remote_argument: true
    options: ["-u", "--set-upstream", "-f", "--force", "--force-with-lease", "--tags", "--delete", "-d", "--dry-run", "-n", "-v", "--verbose", "-q", "--quiet", "--follow-tags", "--all", "--"]
  pull:
    read: false
    touches_origin: true
    remote_argument: true
    options: ["--rebase", "--no-rebase", "--ff-only", "--no-ff", "--ff", "--no-edit", "--autostash", "--no-autostash", "--squash", "--no-commit", "-q", "--quiet", "-v", "--verbose", "--"]
  fetch:
    read: false
    touches_origin: true
    remote_argument: true
    options: ["--all", "--prune", "--tags", "-t", "--no-tags", "--dry-run", "-f", "--force", "-q", "--quiet", "-v", "--verbose", "--"]
  remote:
    read: true
    choices: ["show", "get-url"]
    # `show <URL>` contacterait l'adresse : seuls les remotes du dépôt sont nommés.
    remote_names_from: 1
    options: ["-v", "--verbose", "--"]
  reflog:
    read: true
    refused_arguments: ["expire", "delete", "write"]
    options: ["--all", "--date", "--oneline", "-n", "--max-count", "--"]
    value_options: ["-n", "--max-count"]
    number_option: true
  rm:
    read: false
    options: ["--cached", "-r", "-f", "--force", "-n", "--dry-run", "-q", "--quiet", "--"]
  mv:
    read: false
    options: ["-f", "--force", "-n", "--dry-run", "-v", "--verbose", "-k", "--"]
  config:
    read:
      options_within: ["--get", "--get-all", "--list", "-l"]
      positionals_max: 1
    options: ["--get", "--get-all", "--list", "-l"]
    positionals_max: 2
    writable_keys: ["user.name", "user.email"]
  blame:
    read: true
    options: ["-L", "-w", "-e", "--show-email", "-s", "--porcelain", "--"]
    value_options: ["-L"]
  shortlog:
    read: true
    options: ["-s", "--summary", "-n", "--numbered", "-e", "--email", "--"]
  ls-files:
    read: true
    options: ["-s", "--stage", "-c", "--cached", "-o", "--others", "-m", "--modified", "-d", "--deleted", "-u", "--unmerged", "--exclude-standard", "--error-unmatch", "--"]
  rev-parse:
    read: true
    options: ["--abbrev-ref", "--short", "--show-toplevel", "--is-inside-work-tree", "--verify", "-q", "--quiet", "--symbolic-full-name", "--show-prefix", "--"]
  cat-file:
    read: true
    options: ["-p", "-t", "-s", "-e"]
