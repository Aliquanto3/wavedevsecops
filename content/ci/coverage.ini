# Réglages de coverage pour la quality gate du pipeline simulé (story 8.4).
# pytest et `coverage json` sont lancés avec `--cov-config {config}/coverage.ini` (ou `--rcfile`) :
# ce fichier, hors du dépôt de l'apprenant, remplace `.coveragerc`, `setup.cfg`, `tox.ini` et
# `[tool.coverage]` de `pyproject.toml`. L'apprenant ne peut donc ni exclure un fichier de la
# mesure (`omit`), ni réduire le périmètre (`source`), ni écarter des lignes avec ses propres
# motifs d'exclusion.
[run]
# Tout le dépôt testé, y compris les fichiers jamais importés (comptés à 0 %).
source = .
branch = False

[report]
# Les dossiers sans __init__.py (src/) comptent aussi : un module jamais importé vaut 0 %.
include_namespace_packages = True
# `exclude_lines` remplace les motifs par défaut de coverage, dont `# pragma: no cover` :
# une ligne qui n'est pas exécutée par un test reste non couverte, quoi qu'elle porte en commentaire.
# Le motif ci-dessous ne correspond à aucune ligne de code réelle.
exclude_lines =
    ^\x00NEVER MATCHES\x00$
exclude_also =
