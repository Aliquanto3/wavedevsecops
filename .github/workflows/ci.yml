name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ruff + pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer Python 3.14 et les dépendances (uv.lock figé)
        run: uv sync --locked --group chain

      # AD-12 : précharge `<data>/uv-cache` comme l'installeur (story 7.1) : interpréteur géré
      # dans uv-cache/python et paquets de chaque uv.lock du contenu (seule étape réseau). Les
      # tests des gabarits tournent ensuite dans un environnement créé par
      # `toolrun.sync_environment` (`uv sync --offline --frozen`), `httpx` compris
      # (WDS_EXERCISE_UV, WDS_EXERCISE_DATA, tests/test_exercise.py).
      - name: Précharger le cache uv des gabarits d'exercice
        shell: bash
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/wds-exercise/uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/wds-exercise/uv-cache/python
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          find content -type f -name uv.lock | sort | while IFS= read -r lock; do
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/preload-venv" \
              uv sync --frozen --all-groups --all-extras --project "$(dirname "$lock")"
            rm -rf "$RUNNER_TEMP/preload-venv"
          done

      # Story 7.3 : le vrai hook pre-commit lance le vrai gitleaks (archive officielle, somme
      # vérifiée) depuis `<data>/tools/gitleaks/`, comme l'installeur le pose.
      - name: Poser gitleaks pour le test du hook pre-commit
        run: uv run python .github/scripts/provisionner_gitleaks.py "${{ runner.temp }}/wds-exercise"

      # AD-3 : git parle français quand une locale française existe. Sans elle, le test du
      # terminal en français est ignoré ; on la génère sous Linux pour qu'il tourne.
      - name: Locale française (git en français)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends locales && sudo locale-gen fr_FR.UTF-8

      - name: ruff
        run: uv run ruff check .

      # Contient les contrôles d'AD-13 (imports réseau, URL de static/, hook d'audit
      # socket.connect), les règles de dépendance d'AD-1 et la cohérence des versions d'AD-16.
      - name: pytest
        run: uv run pytest -q --tb=short -n auto --durations=15
        env:
          WDS_EXERCISE_UV: "1"
          WDS_EXERCISE_DATA: ${{ runner.temp }}/wds-exercise

      # AD-13, contrôle (4) : la suite de scénarios rejouée sans réseau, sous-processus
      # (git) compris. L'espace de noms est créé par root, les tests tournent en runner.
      - name: Scénarios sans réseau (unshare -n)
        if: runner.os == 'Linux'
        env:
          WDS_EXERCISE_UV: "1"
          WDS_EXERCISE_DATA: ${{ runner.temp }}/wds-exercise
        run: >
          sudo unshare --net --
          sudo -E -u "$(id -un)" env "PATH=$PATH" "HOME=$HOME"
          "WDS_EXERCISE_UV=$WDS_EXERCISE_UV" "WDS_EXERCISE_DATA=$WDS_EXERCISE_DATA"
          .venv/bin/python -m pytest -q --tb=short
          tests/test_scenarios.py tests/test_setup.py tests/test_fingerprints.py
          tests/test_exercise.py tests/test_terminal_tools.py tests/test_pipeline.py

      # AD-18 : les empreintes ne bougent pas sur un clone en core.autocrlf=true. Les fichiers
      # du dépôt sont réextraits avec ce réglage, puis les empreintes recomparées.
      # `.gitattributes` impose `eol=lf`, qui primerait sur core.autocrlf : on le lève par
      # `.git/info/attributes`, puis on vérifie que le scénario est bien extrait en CRLF.
      - name: Empreintes sur un clone core.autocrlf=true
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf true
          mkdir -p .git/info
          printf '* text=auto !eol\n' > .git/info/attributes
          git rm -r --cached --quiet .
          git reset --hard --quiet
          git ls-files --eol content/scenarios/bac-a-sable-libre.A.yaml | grep -q 'w/crlf'
          uv run pytest -q --tb=short tests/test_scenarios.py tests/test_fingerprints.py

      # Contrôle statique de l'installeur POSIX (shellcheck est préinstallé sur ubuntu-latest).
      - name: shellcheck install.sh
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck -s sh install.sh

  installeur-unix:
    name: install.sh réel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Runner neuf, sans droits administrateur requis. WDS_INSTALL_FORCE_PROVISION_GIT=1 ignore
      # le git du runner pour exercer la voie pixi + conda-forge ; le clone cible la branche testée.
      - name: Installer avec install.sh (durée relevée)
        env:
          WDS_DATA_DIR: ${{ runner.temp }}/wds-data
          WDS_INSTALL_REF: ${{ github.head_ref || github.ref_name }}
          WDS_INSTALL_FORCE_PROVISION_GIT: "1"
        run: |
          start=$(date +%s)
          sh install.sh
          echo "Durée de l'installation : $(( $(date +%s) - start )) s"

      - name: Vérifier l'installation
        env:
          WDS_DATA_DIR: ${{ runner.temp }}/wds-data
        run: |
          cat "$WDS_DATA_DIR/install.json"
          "$WDS_DATA_DIR/tools/bin/git" --version
          "$WDS_DATA_DIR/tools/gitleaks/gitleaks" version
          test -f "$WDS_DATA_DIR/app/pyproject.toml"

      # Story 7.1 : la chaîne fonctionne réseau coupé depuis le uv-cache préchargé (sous Linux,
      # dans un espace de noms sans réseau ; l'espace est créé par root, le script tourne en runner).
      - name: Chaîne hors ligne (uv-cache, toolrun, diagnostic)
        env:
          WDS_DATA_DIR: ${{ runner.temp }}/wds-data
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set --
          if [ "$RUNNER_OS" = Linux ]; then
            # Le premier sudo vide l'environnement : les variables utiles sont repassées par env.
            set -- sudo unshare --net -- sudo -E -u "$(id -un)" \
              env "PATH=$PATH" "HOME=$HOME" "WDS_DATA_DIR=$WDS_DATA_DIR"
          fi
          "$@" "$WDS_DATA_DIR/app/.venv/bin/python" .github/scripts/verifier_hors_ligne.py

  installeur-windows:
    name: install.ps1 réel (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Story 7.1 : gitleaks vérifié par checksums.txt et uv-cache préchargé, sous Windows.
      - name: Installer avec install.ps1 (durée relevée)
        shell: powershell
        env:
          WDS_DATA_DIR: ${{ runner.temp }}\wds-data
          WDS_INSTALL_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          $watch = [Diagnostics.Stopwatch]::StartNew()
          & .\install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "Durée de l'installation : $([Math]::Round($watch.Elapsed.TotalSeconds)) s"

      - name: Chaîne hors ligne (uv-cache, toolrun, diagnostic)
        shell: bash
        env:
          WDS_DATA_DIR: ${{ runner.temp }}\wds-data
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cat "$WDS_DATA_DIR/install.json"
          "$WDS_DATA_DIR/tools/gitleaks/gitleaks.exe" version
          "$WDS_DATA_DIR/app/.venv/Scripts/python.exe" .github/scripts/verifier_hors_ligne.py
