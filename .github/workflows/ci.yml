name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ruff + pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer Python 3.14 et les dépendances (uv.lock figé)
        run: uv sync --locked --group chain

      # AD-12 : précharge le cache uv avec les verrous des gabarits d'exercice (seule étape
      # réseau). Les tests des gabarits tournent ensuite dans un environnement créé par
      # `uv sync --offline --frozen`, `httpx` compris (WDS_EXERCISE_UV, tests/test_exercise.py).
      - name: Précharger le cache uv des gabarits d'exercice
        shell: bash
        run: |
          for track in llm no_ai; do
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv-$track" \
              uv sync --frozen --project "content/exercise/$track"
          done

      - name: ruff
        run: uv run ruff check .

      # Contient les contrôles d'AD-13 (imports réseau, URL de static/, hook d'audit
      # socket.connect), les règles de dépendance d'AD-1 et la cohérence des versions d'AD-16.
      - name: pytest
        run: uv run pytest -q --tb=short
        env:
          WDS_EXERCISE_UV: "1"

      # AD-13, contrôle (4) : la suite de scénarios rejouée sans réseau, sous-processus
      # (git) compris. L'espace de noms est créé par root, les tests tournent en runner.
      - name: Scénarios sans réseau (unshare -n)
        if: runner.os == 'Linux'
        env:
          WDS_EXERCISE_UV: "1"
        run: >
          sudo unshare --net --
          sudo -E -u "$(id -un)" env "PATH=$PATH" "HOME=$HOME"
          .venv/bin/python -m pytest -q --tb=short
          tests/test_scenarios.py tests/test_setup.py tests/test_fingerprints.py
          tests/test_exercise.py

      # AD-18 : les empreintes ne bougent pas sur un clone en core.autocrlf=true. Les fichiers
      # du dépôt sont réextraits avec ce réglage, puis les empreintes recomparées.
      # `.gitattributes` impose `eol=lf`, qui primerait sur core.autocrlf : on le lève par
      # `.git/info/attributes`, puis on vérifie que le scénario est bien extrait en CRLF.
      - name: Empreintes sur un clone core.autocrlf=true
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf true
          mkdir -p .git/info
          printf '* text=auto !eol\n' > .git/info/attributes
          git rm -r --cached --quiet .
          git reset --hard --quiet
          git ls-files --eol content/scenarios/bac-a-sable-libre.A.yaml | grep -q 'w/crlf'
          uv run pytest -q --tb=short tests/test_scenarios.py tests/test_fingerprints.py

      # Contrôle statique de l'installeur POSIX (shellcheck est préinstallé sur ubuntu-latest).
      - name: shellcheck install.sh
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck -s sh install.sh

  installeur-unix:
    name: install.sh réel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Runner neuf, sans droits administrateur requis. WDS_INSTALL_FORCE_PROVISION_GIT=1 ignore
      # le git du runner pour exercer la voie pixi + conda-forge ; le clone cible la branche testée.
      - name: Installer avec install.sh (durée relevée)
        env:
          WDS_DATA_DIR: ${{ runner.temp }}/wds-data
          WDS_INSTALL_REF: ${{ github.head_ref || github.ref_name }}
          WDS_INSTALL_FORCE_PROVISION_GIT: "1"
        run: |
          start=$(date +%s)
          sh install.sh
          echo "Durée de l'installation : $(( $(date +%s) - start )) s"

      - name: Vérifier l'installation
        env:
          WDS_DATA_DIR: ${{ runner.temp }}/wds-data
        run: |
          cat "$WDS_DATA_DIR/install.json"
          "$WDS_DATA_DIR/tools/bin/git" --version
          "$WDS_DATA_DIR/tools/gitleaks/gitleaks" version
          test -f "$WDS_DATA_DIR/app/pyproject.toml"
