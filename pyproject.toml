[project]
name = "wavedevsecops"
version = "0.1.0.dev0"
description = "Application pédagogique locale pour apprendre git, GitHub, la CI/CD et le DevSecOps, hors ligne."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Anaël Yahi" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.144.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "watchfiles==1.3.0",
    "platformdirs==4.13.4",
]

[project.scripts]
wavedevsecops = "wavedevsecops.cli:main"

[project.optional-dependencies]
window = ["pywebview==6.2.1"]

[dependency-groups]
# Outils de la chaîne DevSecOps, aux versions exactes de la table Stack du spine (AD-16).
chain = [
    "ruff==0.17.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.2",
    "diff-cover==10.6.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
]
dev = [
    "ruff==0.17.1",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.0"
# `uv sync` installe aussi les outils de la chaîne : le diagnostic les vérifie (AD-16, FR-19).
default-groups = ["dev", "chain"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["_bmad", "_bmad-output", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: test lent (vrai git en boucle, vrais outils, serveur réel, scénario complet) ; exclu par -m \"not slow\", toujours lancé en CI",
]
